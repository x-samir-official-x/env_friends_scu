<meta name="theme-color" content="#052549" />
<script>
  /* تطبيق الثيم واللغة قبل الرسم عشان مفيش وميض */
  (function(){
    try{
      var th = localStorage.getItem('ef-theme');
      if(!th) th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var lg = localStorage.getItem('ef-lang') || 'ar';
      var d = document.documentElement;
      d.setAttribute('data-theme', th); d.setAttribute('data-lang', lg);
      try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('no-splash'); }catch(e){}
      d.setAttribute('lang', lg); d.setAttribute('dir', lg === 'ar' ? 'rtl' : 'ltr');
    }catch(e){}
  })();
</script>

<style>
/* ═══ Splash (inline عشان يظهر فورًا قبل أي ملف) ═══ */
#splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 42%,#FFFFFF 0%,#FCFCF9 45%,#EEF4E6 100%);color:#052549;font-family:'Cairo','Inter',system-ui,sans-serif;transition:opacity .7s ease,visibility .7s}
.no-splash #splash{display:none}
html:not(.no-splash) body{overflow:hidden}
#splash.sp-out{opacity:0;visibility:hidden}
#splash-globe{position:absolute;inset:0;width:100%;height:100%;display:block}
.sp-fallback{position:absolute;left:50%;top:40%;translate:-50% -50%;width:min(46vmin,360px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(26,105,41,.35);box-shadow:inset 0 0 0 18px rgba(137,197,74,.08);animation:spspin 6s linear infinite}
.sp-fallback::before,.sp-fallback::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:2px solid rgba(137,197,74,.55);transform:rotateX(70deg) rotateZ(20deg)}
.sp-fallback::after{inset:-26%;border-color:rgba(5,37,73,.18);transform:rotateX(65deg) rotateZ(-30deg)}
.sp-3d .sp-fallback{display:none}
@keyframes spspin{to{transform:rotate(360deg)}}
.sp-center{position:absolute;z-index:2;left:0;right:0;top:calc(var(--gb,64%) + 28px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:.25rem;padding:0 1.5rem}
.sp-logo{position:absolute;z-index:3;left:50%;top:40%;width:min(17vmin,118px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:#FCFCF9;padding:6px;
  box-shadow:0 18px 40px -14px rgba(5,37,73,.45),0 0 0 6px rgba(137,197,74,.22);animation:sppop .9s .15s cubic-bezier(.2,1.3,.4,1) both}
.sp-logo img{width:100%;height:100%;object-fit:contain;display:block}
.sp-center h1{font-size:clamp(1.5rem,4.2vw,2.3rem);font-weight:900;letter-spacing:-.01em;line-height:1.2;animation:sprise .8s .35s ease both}
.sp-center p{font-size:clamp(.85rem,2.2vw,1rem);font-weight:700;color:#1A6929;animation:sprise .8s .5s ease both}
.sp-bar{margin-top:1.1rem;width:min(220px,60vw);height:4px;border-radius:9px;background:rgba(5,37,73,.1);overflow:hidden;animation:sprise .8s .65s ease both}
.sp-bar span{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#1A6929,#89C54A);transition:width .5s ease}
[dir="rtl"] .sp-bar span{margin-inline-start:0;background:linear-gradient(270deg,#1A6929,#89C54A)}
@keyframes sppop{from{opacity:0;transform:scale(.4)}}
@keyframes sprise{from{opacity:0;transform:translateY(14px)}}
#splash.sp-out .sp-logo{transform:scale(1.25);transition:transform .7s ease}
</style>
