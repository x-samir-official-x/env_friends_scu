<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>أصدقاء البيئة — كلية التجارة | جامعة قناة السويس</title>
<meta name="description" content="فريق أصدقاء البيئة — كلية التجارة، جامعة قناة السويس. معًا من أجل بيئة أفضل." />
<meta name="theme-color" content="#052549" />
<script>
  /* تطبيق الثيم واللغة قبل الرسم عشان مفيش وميض */
  (function(){
    try{
      var th = localStorage.getItem('ef-theme');
      if(!th) th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var lg = localStorage.getItem('ef-lang') || 'ar';
      var d = document.documentElement;
      d.setAttribute('data-theme', th); d.setAttribute('data-lang', lg);
      d.setAttribute('lang', lg); d.setAttribute('dir', lg === 'ar' ? 'rtl' : 'ltr');
    }catch(e){}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/png" href="./Gemini_Generated_Image_sizaexsizaexsiza-removebg-preview.png" />
</head>
<body>

<!-- ═════════ NAVBAR ═════════ -->
<header id="navbar" class="header">
  <div class="header-inner">
    <button class="icon-btn nav-burger" id="nav-burger" data-i18n-aria="menu"><i class="ph-bold ph-list"></i></button>
    <a href="#hero" class="nav-brand">
      <img id="brand-logo" alt="" />
      <span class="brand-text"><strong data-i18n="brand"></strong><small data-i18n="brandSub"></small></span>
    </a>
    <nav class="nav-desktop"><div class="nav-list" id="nav-list"></div></nav>
    <div class="nav-actions">
      <button class="switch lang-switch" id="lang-toggle" data-i18n-aria="langLabel" type="button">
        <span class="seg">ع</span><span class="seg">EN</span><span class="thumb"></span>
      </button>
      <button class="switch theme-switch" id="theme-toggle" role="switch" data-i18n-aria="themeLabel" type="button">
        <i class="ph-fill ph-sun seg"></i><i class="ph-fill ph-moon seg"></i><span class="thumb"></span>
      </button>
      <a href="#join" class="nav-cta" data-i18n="navJoin"></a>
    </div>
  </div>
</header>
<div class="drawer-overlay" id="drawer-overlay"></div>
<aside class="drawer" id="drawer">
  <button class="icon-btn drawer-close" id="drawer-close"><i class="ph-bold ph-x"></i></button>
  <div class="drawer-list" id="drawer-list"></div>
</aside>

<main>
<!-- ═════════ HERO ═════════ -->
<section id="hero" class="hero">
  <div class="hero-bg" data-bg="hero"></div>
  <div class="hero-overlay"></div>
  <div class="leaves" id="leaves" aria-hidden="true"></div>
  <div class="hero-inner">
    <div class="hero-logos reveal">
      <img id="hero-logo-1" alt="" /><span class="logo-sep"></span><img id="hero-logo-2" alt="" />
    </div>
    <span class="hero-pill reveal"><i class="ph-fill ph-leaf"></i><span data-i18n="heroPill"></span></span>
    <h1 class="hero-title reveal"><span data-i18n="heroTitle"></span><em data-i18n="heroTitle2"></em></h1>
    <p class="hero-sub reveal" data-i18n="heroSub"></p>
    <div class="hero-buttons reveal">
      <a href="#join" class="btn btn-primary"><i class="ph-bold ph-user-plus"></i><span data-i18n="heroBtn1"></span></a>
      <a href="#campaigns" class="btn btn-ghost"><i class="ph-bold ph-compass"></i><span data-i18n="heroBtn2"></span></a>
    </div>
  </div>
  <a href="#stats" class="scroll-hint"><span data-i18n="scroll"></span><i class="ph-bold ph-caret-double-down"></i></a>
</section>

<!-- ═════════ STATS ═════════ -->
<section id="stats" class="section s-alt">
  <div class="wave" data-wave="1"></div>
  <div class="container">
    <header class="sec-head reveal"><span class="pill"><i class="ph-bold ph-chart-line-up"></i><span data-i18n="statsPill"></span></span><h2 data-i18n="statsTitle"></h2><p data-i18n="statsSub"></p></header>
    <div class="stats-grid" id="stats-grid"></div>
  </div>
</section>

<!-- ═════════ ABOUT ═════════ -->
<section id="about" class="section s-base">
  <div class="wave" data-wave="2"></div>
  <div class="container">
    <header class="sec-head reveal"><span class="pill"><i class="ph-bold ph-info"></i><span data-i18n="aboutPill"></span></span><h2 data-i18n="aboutTitle"></h2><p data-i18n="aboutSub"></p></header>
    <div class="about-cards" id="about-cards"></div>
    <div class="link-cards" id="link-cards"></div>
  </div>
</section>

<!-- ═════════ SUPERVISION ═════════ -->
<section id="supervision" class="section s-alt">
  <div class="wave" data-wave="3"></div>
  <div class="container">
    <header class="sec-head reveal"><span class="pill"><i class="ph-bold ph-graduation-cap"></i><span data-i18n="supPill"></span></span><h2 data-i18n="supTitle"></h2><p data-i18n="supSub"></p></header>
    <div class="vip-grid" id="supervision-grid"></div>
  </div>
</section>

<!-- ═════════ LEADERSHIP ═════════ -->
<section id="leadership" class="section s-base">
  <div class="wave" data-wave="1"></div>
  <div class="container">
    <header class="sec-head reveal"><span class="pill"><i class="ph-bold ph-crown-simple"></i><span data-i18n="leadPill"></span></span><h2 data-i18n="leadTitle"></h2><p data-i18n="leadSub"></p></header>
    <div class="vip-grid leaders" id="leadership-grid"></div>
  </div>
</section>

<!-- ═════════ CAMPAIGNS ═════════ -->
<section id="campaigns" class="section s-alt">
  <div class="wave" data-wave="2"></div>
  <div class="container">
    <header class="sec-head reveal"><span class="pill"><i class="ph-bold ph-megaphone"></i><span data-i18n="campPill"></span></span><h2 data-i18n="campTitle"></h2><p data-i18n="campSub"></p></header>
    <div class="camp-grid" id="campaigns-grid"></div>
  </div>
</section>

<!-- ═════════ JOIN ═════════ -->
<section id="join" class="section join">
  <div class="join-bg" data-bg="join"></div>
  <div class="join-overlay"></div>
  <div class="wave down" data-wave="3" data-from="alt"></div>
  <div class="container join-inner">
    <div class="join-glass reveal">
      <span class="open-badge"><span class="pulse-dot"></span><span data-i18n="joinBadge"></span></span>
      <h2 data-i18n="joinTitle"></h2>
      <p data-i18n="joinSub"></p>
      <a href="#" class="btn btn-primary btn-lg" data-link="registrationForm"><i class="ph-bold ph-paper-plane-tilt"></i><span data-i18n="joinBtn"></span></a>
    </div>
  </div>
</section>

<!-- ═════════ CONTACT ═════════ -->
<section id="contact" class="section s-base contact">
  <div class="wave" data-wave="1"></div>
  <div class="container">
    <header class="sec-head reveal"><span class="pill"><i class="ph-bold ph-chats-circle"></i><span data-i18n="contactPill"></span></span><h2 data-i18n="contactTitle"></h2><p data-i18n="contactSub"></p></header>
    <a class="fb-orb reveal" id="contact-fb" target="_blank" rel="noopener">
      <span class="orb"><i class="ph-fill ph-facebook-logo"></i></span>
      <span class="orb-text"><strong data-i18n="contactFb"></strong><span id="contact-handle" dir="ltr"></span></span>
    </a>
  </div>
</section>
</main>

<!-- ═════════ FOOTER ═════════ -->
<footer class="footer">
  <div class="footer-bg" data-bg="footer"></div>
  <div class="footer-overlay"></div>
  <div class="wave down" data-wave="2" data-from="base"></div>
  <div class="container footer-inner">
    <div class="footer-grid">
      <div class="footer-brand">
        <div class="footer-logo"><img id="footer-logo" alt="" /><div><strong data-i18n="brand"></strong><small data-i18n="brandSub"></small></div></div>
        <p class="footer-motto" data-i18n="footMotto"></p>
        <p class="footer-desc" data-i18n="footDesc"></p>
      </div>
      <div class="footer-col"><h3 data-i18n="footLinks"></h3><ul id="footer-links"></ul></div>
      <div class="footer-col"><h3 data-i18n="footFollow"></h3><div class="socials" id="socials"></div></div>
      <div class="footer-cta">
        <h3 data-i18n="footJoinTitle"></h3><p data-i18n="footJoinSub"></p>
        <a href="#" class="btn btn-primary" data-link="registrationForm"><i class="ph-bold ph-paper-plane-tilt"></i><span data-i18n="joinBtn"></span></a>
      </div>
    </div>
    <div class="footer-bottom"><p data-i18n="rights"></p></div>
  </div>
</footer>

<div class="toast" id="toast" role="status"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
