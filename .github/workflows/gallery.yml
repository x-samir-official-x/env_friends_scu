# أي صور جديدة تترفع في assets/events/** → تتصغّر ويتحدّث gallery.json تلقائيًا
name: Build gallery
on:
  push:
    branches: [main]
    paths: ["assets/events/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow && python tools/build_gallery.py
      - run: |
          git config user.name "gallery-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && (git diff --cached --quiet || git commit -m "chore: update gallery" && git push)
